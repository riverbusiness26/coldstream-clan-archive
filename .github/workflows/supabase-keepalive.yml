# Keeps the Supabase project awake.
#
# A free Supabase project pauses after seven days with no database activity,
# and an unpausing project means a dead site until someone notices. This runs
# a trivial read every three days, which is well inside that window even if a
# run or two is skipped.
#
# The key used here is the publishable (anon) key. It is public by design: it
# ships in the site's JavaScript and every request it makes is still gated by
# row level security. It is not a secret and does not belong in one. The
# service role key would be a different matter, and is deliberately not used.

name: Supabase keep-alive

on:
  schedule:
    - cron: '17 6 */3 * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Read one row
        env:
          SUPABASE_URL: https://zcpbpcktinlqnxmqddzc.supabase.co
          SUPABASE_ANON_KEY: sb_publishable_JvhNGgAid0KgMiAqul5lWw_aSrZj0Bo
        run: |
          code=$(curl -s -o /tmp/out.txt -w '%{http_code}' \
            -H "apikey: $SUPABASE_ANON_KEY" \
            -H "Authorization: Bearer $SUPABASE_ANON_KEY" \
            "$SUPABASE_URL/rest/v1/server_status?select=server_key&limit=1")
          echo "HTTP $code"
          cat /tmp/out.txt
          # A 200 means awake and reachable. Anything else should be loud:
          # a 401 here is the grants problem, not a sleeping project.
          test "$code" = "200"
