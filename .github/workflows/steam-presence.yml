# Keeps the members tracker fresh.
#
# The site reads a table, and this is what fills it. Running it here rather
# than from the browser means one call to Steam serves every visitor, and the
# Steam key stays in the edge function where no browser can reach it.
#
# Every five minutes is a deliberate compromise. Steam's own friends list is
# not instant either, presence that is five minutes stale still answers the
# only question people ask ("is anyone about?"), and it keeps us far inside
# any rate limit. GitHub also does not honour tighter schedules reliably on
# free runners, so asking for one minute would buy nothing but a lie in the
# config.
#
# Needs one repository secret: SYNC_SECRET, the same value set on the edge
# function. Nothing else, and no Steam key here.

name: Steam presence

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

# If a run is somehow still going when the next is due, skip rather than
# stack. A missed presence update matters far less than two writing at once.
concurrency:
  group: steam-presence
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Refresh who is online
        env:
          SYNC_SECRET: ${{ secrets.SYNC_SECRET }}
        run: |
          if [ -z "$SYNC_SECRET" ]; then
            echo "SYNC_SECRET is not set as a repository secret."
            echo "Settings, Secrets and variables, Actions, New repository secret."
            echo "Use the same value the steam-presence function has."
            exit 1
          fi
          # A ceiling, so a hung request fails in a minute with a clear
          # message instead of tying up a runner. The function budgets
          # itself to 25 seconds, so anything near this is a real problem.
          out=$(curl -sS --max-time 60 -w '\n%{http_code}' \
            "https://zcpbpcktinlqnxmqddzc.supabase.co/functions/v1/steam-presence?secret=$SYNC_SECRET")
          body=$(printf '%s' "$out" | sed '$d')
          code=$(printf '%s' "$out" | tail -n1)
          echo "$body"
          if [ "$code" != "200" ]; then
            echo "presence sync returned $code"
            exit 1
          fi
