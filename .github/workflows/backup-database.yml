# Nightly export of everything that lives only in the database.
#
# The site's archive is already safe: the roster, the eras, the films, the
# recovered screenshots and the announcement record are all JSON and images
# committed to this repo, which means they survive anything that happens to any
# one company. What is NOT safe is everything written since: forum threads and
# posts, gallery submissions, the shoutbox, member accounts and events. Those
# exist in exactly one place, on a free tier, behind one person's login.
#
# This pulls them into a separate private repository every night as plain JSON.
# The website repository is public, so writing staff posts, member identifiers
# or unapproved gallery submissions here would turn a backup into a data leak.
# If Supabase vanished tomorrow the community would lose nothing older than 24
# hours, and the export is readable without any database software.
#
# Needs two repository secrets and one repository variable:
#   SUPABASE_SERVICE_ROLE_KEY, the existing Supabase service role key
#   BACKUP_REPOSITORY_TOKEN, a fine grained token that can write only to the
#     private backup repository
#   BACKUP_REPOSITORY, owner/name for that private repository
# The service role key bypasses row level security, which is the point: it is
# the only way to back up the staff board and the unapproved uploads too. It is
# never printed. GitHub masks both secrets in logs.

name: Backup database

on:
  schedule:
    - cron: '40 3 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - name: Check backup settings
        env:
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          BACKUP_REPOSITORY_TOKEN: ${{ secrets.BACKUP_REPOSITORY_TOKEN }}
          BACKUP_REPOSITORY: ${{ vars.BACKUP_REPOSITORY }}
        run: |
          missing=0
          for name in SUPABASE_SERVICE_ROLE_KEY BACKUP_REPOSITORY_TOKEN BACKUP_REPOSITORY; do
            if [ -z "${!name}" ]; then
              echo "$name is not configured."
              missing=1
            fi
          done
          exit "$missing"

      - uses: actions/checkout@v4
        with:
          repository: ${{ vars.BACKUP_REPOSITORY }}
          token: ${{ secrets.BACKUP_REPOSITORY_TOKEN }}
          path: backup-repository

      - name: Export every table
        env:
          SUPABASE_URL: https://zcpbpcktinlqnxmqddzc.supabase.co
          KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SOURCE_COMMIT: ${{ github.sha }}
        run: |
          rm -rf backup-repository/.next
          mkdir -p backup-repository/.next
          TABLES="member roster_entry board thread post gallery_category gallery_item shout server_status news_item operator event event_rsvp enlistment steam_group steam_group_member steam_group_snapshot"

          # PostgREST caps a response at db.max_rows, which defaults to 1000 on
          # Supabase. A backup that silently stops at a thousand rows is worse
          # than no backup, because it looks like it worked. So every table is
          # pulled a page at a time until a short page comes back, and the
          # pages are joined here rather than trusting one request.
          for t in $TABLES; do
          node - "$SUPABASE_URL" "$KEY" "$t" "backup-repository/.next" <<'JS'
              const [url, key, table, outputDirectory] = process.argv.slice(2);
              const fs = require('fs');
              const path = require('path');
              const PAGE = 1000;
              (async () => {
                const all = [];
                for (let from = 0; ; from += PAGE) {
                  const res = await fetch(`${url}/rest/v1/${table}?select=*`, {
                    headers: {
                      apikey: key,
                      Authorization: `Bearer ${key}`,
                      Range: `${from}-${from + PAGE - 1}`,
                    },
                  });
                  if (!res.ok) {
                    // Missing and forbidden tables both make the snapshot
                    // incomplete. Fail instead of preserving a convincing
                    // partial backup.
                    console.error(`${table}: HTTP ${res.status}`);
                    process.exitCode = 1;
                    return;
                  }
                  const page = await res.json();
                  all.push(...page);
                  if (page.length < PAGE) break;
                }
                fs.writeFileSync(path.join(outputDirectory, `${table}.json`), JSON.stringify(all, null, 1));
                console.log(`  ${table}: ${all.length} rows`);
              })();
          JS
          done

          node - "$SOURCE_COMMIT" <<'JS'
            const fs = require('fs');
            const sourceCommit = process.argv[2];
            const files = fs.readdirSync('backup-repository/.next')
              .filter((name) => name.endsWith('.json'))
              .sort();
            const rowCounts = Object.fromEntries(files.map((name) => {
              const rows = JSON.parse(fs.readFileSync(`backup-repository/.next/${name}`, 'utf8'));
              return [name.replace(/\.json$/, ''), rows.length];
            }));
            fs.writeFileSync('backup-repository/.next/_manifest.json', JSON.stringify({
              exported_at: new Date().toISOString(),
              source_project: 'zcpbpcktinlqnxmqddzc',
              source_commit: sourceCommit,
              row_counts: rowCounts,
            }, null, 1));
          JS

          rm -rf backup-repository/latest
          mv backup-repository/.next backup-repository/latest

      - name: Commit if anything changed
        working-directory: backup-repository
        run: |
          git config user.name  "coldstream-backup"
          git config user.email "backup@users.noreply.github.com"
          git add -- latest
          if git diff --staged --quiet; then
            echo "no changes"
          else
            git commit -m "backup: nightly database export"
            git push
          fi
