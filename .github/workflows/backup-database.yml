# Nightly export of everything that lives only in the database.
#
# The site's archive is already safe: the roster, the eras, the films, the
# recovered screenshots and the announcement record are all JSON and images
# committed to this repo, which means they survive anything that happens to any
# one company. What is NOT safe is everything written since: forum threads and
# posts, gallery submissions, the shoutbox, member accounts and events. Those
# exist in exactly one place, on a free tier, behind one person's login.
#
# This pulls them into the repo every night as plain JSON. If Supabase vanished
# tomorrow the community would lose nothing older than 24 hours, and the export
# is readable without any software at all.
#
# Needs one repository secret: SUPABASE_SERVICE_ROLE_KEY.
#   Settings > Secrets and variables > Actions > New repository secret
# The service role key bypasses row level security, which is the point: it is
# the only way to back up the staff board and the unapproved uploads too. It is
# never printed, and GitHub masks it in logs.

name: Backup database

on:
  schedule:
    - cron: '40 3 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Export every table
        env:
          SUPABASE_URL: https://zcpbpcktinlqnxmqddzc.supabase.co
          KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          if [ -z "$KEY" ]; then
            echo "SUPABASE_SERVICE_ROLE_KEY is not set. Add it under"
            echo "Settings > Secrets and variables > Actions, then run this again."
            exit 1
          fi
          mkdir -p backup
          TABLES="member roster_entry board thread post gallery_category gallery_item shout server_status news_item operator event event_rsvp"

          # PostgREST caps a response at db.max_rows, which defaults to 1000 on
          # Supabase. A backup that silently stops at a thousand rows is worse
          # than no backup, because it looks like it worked. So every table is
          # pulled a page at a time until a short page comes back, and the
          # pages are joined here rather than trusting one request.
          for t in $TABLES; do
            node - "$SUPABASE_URL" "$KEY" "$t" <<'JS'
              const [url, key, table] = process.argv.slice(2);
              const fs = require('fs');
              const PAGE = 1000;
              (async () => {
                const all = [];
                for (let from = 0; ; from += PAGE) {
                  const res = await fetch(`${url}/rest/v1/${table}?select=*`, {
                    headers: {
                      apikey: key,
                      Authorization: `Bearer ${key}`,
                      Range: `${from}-${from + PAGE - 1}`,
                    },
                  });
                  if (!res.ok) {
                    // A table that does not exist yet is not a failure. One
                    // that exists and refuses is, so leave nothing misleading.
                    //
                    // Set exitCode and return rather than calling exit(): tearing
                    // the process down while a fetch is still settling trips a
                    // libuv assertion and reports a crash instead of a skip, which
                    // would abort the whole backup over a table we expect to be
                    // missing until the calendar migration is run.
                    console.log(`  ${table}: HTTP ${res.status} (skipped)`);
                    try { fs.unlinkSync(`backup/${table}.json`); } catch {}
                    if (res.status !== 404) process.exitCode = 1;
                    return;
                  }
                  const page = await res.json();
                  all.push(...page);
                  if (page.length < PAGE) break;
                }
                fs.writeFileSync(`backup/${table}.json`, JSON.stringify(all, null, 1));
                console.log(`  ${table}: ${all.length} rows`);
              })();
JS
          done

      - name: Commit if anything changed
        run: |
          git config user.name  "coldstream-backup"
          git config user.email "backup@users.noreply.github.com"
          git add -A backup || true
          if git diff --staged --quiet; then
            echo "no changes"
          else
            git commit -m "Nightly database export"
            git push
          fi
