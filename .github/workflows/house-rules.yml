# The house rules, enforced by a machine instead of by an agent's attention.
#
# Every check here is something an AI was previously spending tokens to
# remember, and getting wrong anyway: the em dash rule has been broken by
# accident several times, including once inside the file that documents it.
# A grep does not get tired, does not have a context window, and does not
# have a usage limit. Public repository, so Actions minutes are free.
#
# The rule for adding to this file: only checks that are deterministic and
# that pass cleanly today. A check that cries wolf gets ignored, and an
# ignored check is worse than no check because it looks like coverage.

name: House rules

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  rules:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # River asked for this explicitly and more than once. Scoped to the
      # things we write by hand: not data/ or lineage/, which are recovered
      # originals that must never be edited to suit our rules, not
      # site/src/seed/, which is generated, and not HANDOFF.md, which is an
      # append only log that already carries some from before the rule.
      #
      # The pattern is a PCRE code point, \x{2014}, rather than the character
      # itself, so that this file does not match its own check. The first
      # version did, which is a fair warning about the whole class of rule.
      - name: No em dashes
        run: |
          export LC_ALL=C.UTF-8
          # Prove the pattern actually matches before trusting a clean run.
          # Outside a UTF-8 locale grep -P rejects \x{2014} and exits 2, and
          # an if statement reads that failure as "found nothing", so the
          # check would pass forever while testing precisely nothing. Caught
          # locally, hence the canary.
          #
          # The canary needs a real em dash to test against, which is why one
          # appears below and why this file is deliberately not in the list of
          # paths scanned above. Do not "fix" either half of that.
          if ! printf 'a—b\n' | grep -qP '\x{2014}'; then
            echo "The em dash pattern does not match in this environment."
            echo "The check cannot be trusted, so it fails rather than lying."
            exit 1
          fi
          if grep -rnP '\x{2014}' \
              AGENTS.md ONBOARDING.md CLAUDE.md README.md claims/ scripts/ \
              --include="*.md" --include="*.mjs" 2>/dev/null \
            || grep -rnP '\x{2014}' site/src --include="*.tsx" --include="*.ts" --include="*.css" 2>/dev/null \
            || grep -rnP '\x{2014}' site/db site/supabase --include="*.sql" --include="*.ts" 2>/dev/null; then
            echo ""
            echo "Found an em dash. Use a comma, a colon, or a middle dot."
            exit 1
          fi
          echo "No em dashes."

      # It is a gaming community. Never a club, never a clan. Checked in the
      # copy people actually read, not in the generated seed, where captions
      # describe historical scenes in their own words.
      #
      # Deliberately NOT checking for "officer". The rank ladder really did
      # have an Officers tier and the gallery captions really do describe
      # officers, so a check here would fail on the history it exists to
      # protect. That rule is about site roles, which are member, moderator
      # and admin, and it is enforced by the database enum instead.
      - name: Vocabulary
        run: |
          if grep -rniE '\b(club|clan)\b' site/src/views site/src/components 2>/dev/null; then
            echo ""
            echo "Say gaming community."
            exit 1
          fi
          echo "Vocabulary is clean."

      # Server configuration templates live in infra/ and are committed with
      # empty or placeholder values on purpose. This is the check that keeps
      # them that way. A real GSLT or RCON password reaching a public repo
      # means the box is compromised, and git history means deleting it later
      # does not undo it: the token has to be rotated.
      - name: No live server secrets
        run: |
          bad=0
          # A GSLT is 32 hex characters. Nothing else in these files should be.
          if grep -rniE '[0-9a-f]{32}' infra/ 2>/dev/null; then
            echo "  ^ looks like a live Steam game server login token"
            bad=1
          fi
          # gslt="" is fine. gslt="anything" is not.
          if grep -rniE '^[[:space:]]*gslt=\"..+\"' infra/ 2>/dev/null; then
            echo "  ^ a GSLT has been filled in"
            bad=1
          fi
          # The placeholder is allowed. A real password is not.
          if grep -rniE 'rcon_password[[:space:]]+\"..+\"' infra/ 2>/dev/null              | grep -viE 'CHANGE_THIS_ON_THE_VPS|CHANGEME|your_|example'; then
            echo "  ^ a real RCON password has been committed"
            bad=1
          fi
          if [ "$bad" = "1" ]; then
            echo ""
            echo "This repository is public. Set real values on the VPS, never here."
            echo "If one of these was already pushed, rotate it: history keeps it."
            exit 1
          fi
          echo "Server configs carry placeholders only."

      # Two different Node versions live on these four lines and confusing
      # them wastes an afternoon. The @v5 is the runtime GitHub runs the
      # action itself on, now Node 24 because Node 20 is deprecated on the
      # runners. The node-version below is what builds the site, and it is a
      # separate decision that has not been made yet.
      #
      # setup-node v5 added automatic caching when package.json carries a
      # packageManager field. Harmless here because cache is set explicitly
      # below, which is why this bump needed no other change.
      - uses: actions/setup-node@v5
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: site/package-lock.json

      - name: Install
        working-directory: site
        run: npm ci

      # The gate that matters most with several agents pushing: this is
      # typecheck plus build, and it is what catches somebody shipping a
      # tree that does not compile.
      - name: Build
        working-directory: site
        run: npm run build

      # The built site is committed at the repo root and that is what
      # Cloudflare publishes. The failure this catches is copying across the
      # new index.html without its assets, which publishes a page that asks
      # for a bundle nobody has and takes the whole site down.
      #
      # It deliberately does not compare the built hash against the committed
      # one. Two machines with different Node versions can differ, and a
      # check that fails for a reason nobody caused is a check everybody
      # learns to ignore.
      - name: The published page has the files it asks for
        run: |
          missing=0
          for f in $(grep -oE 'assets/[A-Za-z0-9._-]+\.(js|css)' index.html | sort -u); do
            if [ -f "$f" ]; then
              echo "  present  $f"
            else
              echo "  MISSING  $f"
              missing=1
            fi
          done
          if [ "$missing" = "1" ]; then
            echo ""
            echo "index.html at the repo root asks for a file that is not committed."
            echo "Copy site/dist/assets/ across as well, not just index.html."
            exit 1
          fi
          echo "Every asset the published page asks for is committed."
